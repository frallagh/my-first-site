<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>
  <style>
    body {
      background-color: #1e293b;
      font-family: sans-serif;
    }
    h1 {
      color: #38bdf8;
    }
    .card {
    background-color: #334155;
    color: #f3f4f6;
    padding: 24px;
    border-radius: 12px;
    max-width: 500px;
    margin: 50px auto;
    }
    #btn {
      padding: 10px 16px;
      background-color: #38bdf8;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>My First Website</h1>
    <p>This is just a test website, there's not really much going on here.</p>
    <p>These are my favourite hobbies:</p>
    <ul>
      <li>play videogames;</li>
      <li>programming</li>
    </ul>
    <button id="btn">Click Me!</button>
    <p id="output"></p>
  </div>
  <script>
    const button = document.querySelector("#btn")
    const output = document.querySelector("#output")
    button.addEventListener("click", function() {
      output.textContent = "Hello from JavaScript!"
    });
  </script>
</body>
</html>
